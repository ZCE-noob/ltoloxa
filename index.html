<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ltoloxa: The Photophobic Phantom</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b101d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #e0f2fe;
    }
    p {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 14px;
      color: #7dd3fc;
    }
    canvas {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <h1>Ltoloxa: The Photophobic Phantom</h1>
  <p>💡 Hover flashlight to inspect/scare | 🦐 Click dark water to drop shrimp food</p>
  <script src="sketch.js"></script>
</body>
</html>
